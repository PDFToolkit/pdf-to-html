name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, iconv, mbstring, zlib
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python -m pip install --require-hashes -r tools/validation-requirements.txt
      - run: python tools/validate_reference.py
      - run: python tools/build_reading_fixture.py --check
      - name: Validate actual derivation with independent PDF and HTML5 parsers
        run: python tools/validate_derivation.py --php php
      - name: Validate the opt-in field runtime with Node
        run: |
          php tests/Script/runtime-fixture.php > "$RUNNER_TEMP/pdf-html-runtime.js"
          node --check "$RUNNER_TEMP/pdf-html-runtime.js"
          node tests/Script/runtime.cjs "$RUNNER_TEMP/pdf-html-runtime.js"
      - name: Execute the documented conversion
        run: php examples/01-derive-tagged-pdf.php
