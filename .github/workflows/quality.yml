name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mathml-browsers:
    name: HTML semantics in Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, iconv, mbstring, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci --prefix tools --ignore-scripts
      - run: npm audit --prefix tools
      - run: node tools/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Check native math layout, exponents and fractions in both engines
        run: |
          mkdir -p _build/mathml
          php tests/export-mathml-cases.php > _build/mathml/cases.json
          node tools/validate_mathml.cjs _build/mathml/cases.json _build/mathml/browsers
      - name: Check widget appearances and pointer states in both engines
        run: |
          mkdir -p _build/widgets
          php tests/export-widget-cases.php > _build/widgets/cases.json
          node tools/validate_widgets.cjs _build/widgets/cases.json _build/widgets/browsers
      - name: Check table, list and text attributes in both engines
        run: |
          mkdir -p _build/attributes
          php tests/export-attribute-conformance.php > _build/attributes/derived.html
          node tools/validate_attribute_conformance.cjs _build/attributes/derived.html _build/attributes/browsers
      - name: Check native signature status popovers and runtime isolation in both engines
        run: |
          mkdir -p _build/signature-popovers
          php tests/export-signature-cases.php > _build/signature-popovers/cases.json
          node tools/validate_signature_popovers.cjs _build/signature-popovers/cases.json _build/signature-popovers/browsers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mathml-browser-evidence
          path: _build/mathml
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-browser-evidence
          path: |
            _build/widgets
            _build/attributes
            _build/signature-popovers
          if-no-files-found: error

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, iconv, mbstring, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python -m pip install --require-hashes -r tools/source-integrity-validation-requirements.txt
      - run: python tools/validate_reference.py
      - run: python tools/build_reading_fixture.py --check
      - run: python tools/build_glyph_list.py --check
      - run: python tools/build_inline_fixture.py --check
      - run: python tools/build_inline_fax_fixture.py --check
      - name: Validate inline images with independent PDF, HTML5 and pixel parsers
        run: python tools/validate_inline_derivation.py --php php
      - name: Validate EC3 ASCII inline-image separator exceptions independently
        run: python tools/validate_inline_separators.py --php php
      - name: Install the independent graphics rendering oracle
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - uses: ./.github/actions/setup-qpdf
      - name: Validate native password authentication and effective permissions independently
        run: python tools/validate_authentication.py --php php --qpdf qpdf
      - name: Validate MAC-required tagged derivation and authentication ports independently
        run: python tools/validate_source_integrity.py --php php --qpdf qpdf
      - name: Validate native public-key permissions and MAC-bound HTML independently
        run: python tools/validate_public_key_authentication.py --php php
      - name: Validate isolated graphics with pypdf and Poppler
        run: python tools/validate_graphics.py --php php
      - name: Compare exported graphics contexts against independent Poppler oracles
        run: python tools/validate_graphics_context.py --php php
      - name: Compare widget appearances and filtered artifacts with native Poppler controls
        run: python tools/validate_appearances.py --php php --work-dir _build/appearances
      - name: Validate signed revision integrity with independent PDF and CMS parsers
        run: python tools/validate_signatures.py --php php --report _build/signatures/report.json
      - name: Validate CCITT inline boundaries with independent libtiff payloads and Poppler
        run: python tools/validate_inline_fax.py --php php
      - name: Validate actual derivation with independent PDF and HTML5 parsers
        run: python tools/validate_derivation.py --php php
      - name: Validate the opt-in field runtime with Node
        run: |
          php tests/Script/runtime-fixture.php > "$RUNNER_TEMP/pdf-html-runtime.js"
          node --check "$RUNNER_TEMP/pdf-html-runtime.js"
          node tests/Script/runtime.cjs "$RUNNER_TEMP/pdf-html-runtime.js"
      - name: Validate actual content parents and field expansion with HTML5 parsing
        run: |
          php tests/export-page-identifiers.php > "$RUNNER_TEMP/page-identifiers.json"
          python tools/validate_page_identifiers.py "$RUNNER_TEMP/page-identifiers.json"
      - name: Execute the documented conversion
        run: php examples/01-derive-tagged-pdf.php
      - name: Execute the documented graphics and safe form examples
        run: |
          php examples/02-export-figure.php tests/Fixtures/tagged.pdf "$RUNNER_TEMP/figure.pdf"
          php examples/03-safe-form-reset.php "$RUNNER_TEMP/safe-reset.html"
      - name: Execute the explicit source MAC example
        env:
          PDFTOOLKIT_PASSWORD: native-user
        run: php examples/04-authenticate-source-mac.php tests/Fixtures/source-integrity/tagged-mac-r6-standalone.pdf "$RUNNER_TEMP/authenticated.html"
      - name: Execute the explicit-certificate signature example
        run: |
          php examples/05-verify-pdf-signature.php tests/Fixtures/signatures/signed-padded.pdf tests/Fixtures/signatures/signer.der "$RUNNER_TEMP/signature-der.html"
          php examples/05-verify-pdf-signature.php tests/Fixtures/signatures/signed-padded.pdf tests/Fixtures/signatures/signer.pem "$RUNNER_TEMP/signature-pem.html"
          php examples/05-verify-pdf-signature.php tests/Fixtures/signatures/signed-padded.pdf tests/Fixtures/signatures/wrong.der "$RUNNER_TEMP/signature-wrong.html"
          cmp "$RUNNER_TEMP/signature-der.html" "$RUNNER_TEMP/signature-pem.html"
          python -c 'import pathlib, sys, html5lib; expected = ["integrity-verified", "invalid"]; actual = [[e.attrib["data-pdf-signature-status"] for e in html5lib.parse(pathlib.Path(p).read_text()).iter() if "data-pdf-signature-status" in e.attrib] for p in sys.argv[1:]]; assert actual == [[s] for s in expected], actual' "$RUNNER_TEMP/signature-der.html" "$RUNNER_TEMP/signature-wrong.html"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-content-evidence-php-${{ matrix.php }}
          path: |
            _build/appearances
            _build/signatures
          if-no-files-found: error
